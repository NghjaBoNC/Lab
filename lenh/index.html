<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sổ Tay Lệnh · NghjaBoNC's Lab</title>
  <link rel="stylesheet" href="../core/theme.css?v=5" />
  <style>
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .tab-b { padding: 7px 4px; border-radius: 10px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: #fff; font-size: 0.72rem; font-weight: 800; cursor: pointer; }
    .tab-b.active { background: #fff; color: var(--text-dark); }
    .cmd-card { background: var(--card-bg); color: var(--text-dark); border-radius: 15px; padding: 11px 13px; display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
    .cmd-card:active { transform: scale(0.98); }
    .cmd-code { font-family: monospace; font-size: 0.86rem; font-weight: 800; color: var(--primary); background: #f3e8ff; padding: 5px 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .cmd-desc { font-size: 0.75rem; color: #4c1d95; }
  </style>
</head>
<body>
  <header class="top-nav">
    <a href="../" class="back-btn">‹ Lab</a>
    <span class="page-title">Sổ Tay Lệnh</span>
  </header>
  <main class="wrap">
    <input id="q-cmd" class="input-box" placeholder="Tìm lệnh (VD: chmod, grep, git, nmap)..." />

    <div class="tabs" id="c-tabs">
      <button class="tab-b active" data-t="all">Tất cả</button>
      <button class="tab-b" data-t="Linux">Linux</button>
      <button class="tab-b" data-t="Net">Mạng/CTF</button>
      <button class="tab-b" data-t="Dev">C++/Git</button>
    </div>

    <details class="white-card" style="font-size:0.82rem;">
      <summary style="font-weight:800;cursor:pointer;color:var(--primary);">+ Thêm lệnh cá nhân mới</summary>
      <div style="display:flex;flex-direction:column;gap:7px;margin-top:9px;">
        <input id="nc-code" class="input-box" placeholder="Cú pháp lệnh (VD: chmod +x run.sh)" />
        <input id="nc-desc" class="input-box" placeholder="Công dụng ngắn gọn..." />
        <button id="nc-save" class="btn-pri">Lưu Vào Kho</button>
      </div>
    </details>

    <div id="c-list" style="display:flex;flex-direction:column;gap:8px;"></div>
  </main>

  <script src="../core/roadmap.js?v=5"></script>
  <script src="../core/store.js?v=5"></script>
  <script>
    const BASE_CMDS = [
      { tag: 'Linux', code: 'pkg update && pkg upgrade -y', desc: 'Cập nhật toàn bộ gói hệ thống trên Termux' },
      { tag: 'Linux', code: 'ls -la', desc: 'Liệt kê toàn bộ file kể cả file ẩn kèm quyền' },
      { tag: 'Linux', code: 'chmod 755 file.sh', desc: 'Cấp quyền thực thi (rwxr-xr-x) cho file' },
      { tag: 'Linux', code: 'grep -rn "text" .', desc: 'Tìm chuỗi ký tự đệ quy trong thư mục hiện tại' },
      { tag: 'Linux', code: 'find . -size 1033c ! -executable', desc: 'Tìm file đúng 1033 byte và không có quyền chạy' },
      { tag: 'Net', code: 'ssh bandit0@bandit.labs.overthewire.org -p 2220', desc: 'Kết nối SSH vào máy chủ OverTheWire Bandit' },
      { tag: 'Net', code: 'base64 -d file.txt', desc: 'Giải mã chuỗi dữ liệu dạng Base64' },
      { tag: 'Net', code: "tr 'A-Za-z' 'N-ZA-Mn-za-m'", desc: 'Giải mã dịch vòng ROT13 qua luồng chuẩn' },
      { tag: 'Net', code: 'nmap -sV 127.0.0.1', desc: 'Quét cổng mở và phiên bản dịch vụ chạy trên IP' },
      { tag: 'Net', code: 'curl -I https://example.com', desc: 'Soi nhanh HTTP Response Header của trang web' },
      { tag: 'Dev', code: 'clang++ main.cpp -o main && ./main', desc: 'Biên dịch và chạy ngay chương trình C++ trên Termux' },
      { tag: 'Dev', code: 'strings ./binary | grep -i pass', desc: 'Trích xuất chuỗi ASCII ẩn trong file nhị phân' },
      { tag: 'Dev', code: 'objdump -d ./binary | head -n 40', desc: 'Dịch ngược mã máy sang hợp ngữ Assembly' },
      { tag: 'Dev', code: 'git add . && git commit -m "update" && git push', desc: 'Đóng gói và đẩy toàn bộ thay đổi lên GitHub' }
    ];

    let curTab = 'all';
    const render = () => {
      const s = LabStore.load(), q = document.getElementById('q-cmd').value.trim().toLowerCase();
      const all = [...s.customCmds.map(x => ({ ...x, tag: 'Linux', custom: true })), ...BASE_CMDS];
      const list = document.getElementById('c-list'); list.innerHTML = '';
      all.filter(x => (curTab === 'all' || x.tag === curTab) && (!q || x.code.toLowerCase().includes(q) || x.desc.toLowerCase().includes(q)))
         .forEach(item => {
           const el = document.createElement('div'); el.className = 'cmd-card';
           el.innerHTML = `<div class="cmd-code"><span>${item.code}</span><span class="cp-lbl" style="font-size:0.66rem;font-family:sans-serif;">Copy</span></div><div class="cmd-desc">${item.custom ? '⭐ ' : ''}${item.desc}</div>`;
           el.onclick = () => {
             navigator.clipboard?.writeText(item.code);
             LabStore.bump('cmdCopies', 1);
             const lbl = el.querySelector('.cp-lbl'); lbl.textContent = 'Đã chép ✓'; lbl.style.color = 'var(--emerald)';
             setTimeout(() => { lbl.textContent = 'Copy'; lbl.style.color = ''; }, 1200);
           };
           list.appendChild(el);
         });
    };

    document.querySelectorAll('#c-tabs .tab-b').forEach(b => b.onclick = () => {
      document.querySelectorAll('#c-tabs .tab-b').forEach(x => x.classList.remove('active'));
      b.classList.add('active'); curTab = b.dataset.t; render();
    });
    document.getElementById('q-cmd').oninput = render;
    document.getElementById('nc-save').onclick = () => {
      const code = document.getElementById('nc-code').value.trim(), desc = document.getElementById('nc-desc').value.trim();
      if (!code) return;
      const s = LabStore.load(); s.customCmds.unshift({ code, desc: desc || 'Lệnh tự lưu' }); LabStore.save(s);
      document.getElementById('nc-code').value = ''; document.getElementById('nc-desc').value = ''; render();
    };
    render();
  </script>
</body>
</html>
